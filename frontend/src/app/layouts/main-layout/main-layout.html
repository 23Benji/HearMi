<div class="app-container">
  <aside class="sidebar" [ngClass]="{ 'sidebar-open': isSidebarOpen }">

    <div class="sidebar-header">
      <a class="logo-wrapper" routerLink="/dashboard" (click)="isSidebarOpen = false">
        <img src="assets/images/HearMi.svg" alt="HearMi Logo">
      </a>
      <button class="close-sidebar-btn" (click)="toggleSidebar()">
        <lucide-icon name="x" [size]="24"></lucide-icon>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="isSidebarOpen = false">
        <lucide-icon name="layout-dashboard" [size]="20"></lucide-icon>
        <span>Dashboard</span>
      </a>

      <p class="nav-section-title">TRAINING MODES</p>

      <a class="nav-link" routerLink="/training/single-note" routerLinkActive="active" (click)="isSidebarOpen = false">
        <lucide-icon name="music" [size]="20"></lucide-icon>
        <span>Single Note</span>
      </a>

      <a class="nav-link" routerLink="/training/chord-recognition" routerLinkActive="active" (click)="isSidebarOpen = false">
        <lucide-icon name="music-2" [size]="20"></lucide-icon>
        <span>Chord Recognition</span>
      </a>

      <a class="nav-link" routerLink="/training/pitch-comparison" routerLinkActive="active" (click)="isSidebarOpen = false">
        <lucide-icon name="git-compare" [size]="20"></lucide-icon>
        <span>Pitch Comparison</span>
      </a>

      <a class="nav-link" routerLink="/training/interval-training" routerLinkActive="active" (click)="isSidebarOpen = false">
        <lucide-icon name="waves" [size]="20"></lucide-icon>
        <span>Interval Training</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <ng-container *ngIf="avatarUrl; else fallbackAvatar">
          <img [src]="avatarUrl" alt="User" class="user-avatar img">
        </ng-container>

        <ng-template #fallbackAvatar>
          <div class="user-avatar">
            {{ usernameInitial }}
          </div>
        </ng-template>

        <div class="user-info">
          <span class="user-name">{{ username || 'User' }}</span>
        </div>
      </div>

      <a routerLink="/settings" class="settings-button" (click)="isSidebarOpen = false">
        <lucide-icon name="cog" [size]="20"></lucide-icon>
      </a>

      <button type="button" class="logout-button" (click)="logout()">
        <lucide-icon name="log-out" [size]="20"></lucide-icon>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <button class="open-sidebar-btn" (click)="toggleSidebar()">
      <lucide-icon name="menu" [size]="24"></lucide-icon>
    </button>
    <router-outlet></router-outlet>
  </main>

  <div class="sidebar-overlay" [ngClass]="{ 'overlay-visible': isSidebarOpen }" (click)="toggleSidebar()"></div>
</div>
