<!-- frontend/src/app/layouts/main-layout/main-layout.component.html -->
<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <lucide-icon name="music" [size]="24"></lucide-icon>
      </div>
      <div class="logo-text">
        <h2>HearMi</h2>
        <p>Ear Training Platform</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <!-- ===== DASHBOARD LINK MOVED HERE ===== -->
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
        <lucide-icon name="layout-dashboard" [size]="20"></lucide-icon>
        <span>Dashboard</span>
      </a>

      <!-- ===== TRAINING MODES SECTION STARTS HERE ===== -->
      <p class="nav-section-title">TRAINING MODES</p>

      <a class="nav-link" routerLink="/training/single-note" routerLinkActive="active">
        <lucide-icon name="music" [size]="20"></lucide-icon>
        <span>Single Note</span>
      </a>
      <a class="nav-link" routerLink="/training/chord-recognition" routerLinkActive="active">
        <lucide-icon name="music-2" [size]="20"></lucide-icon>
        <span>Chord Recognition</span>
      </a>
      <a class="nav-link" routerLink="/training/pitch-comparison" routerLinkActive="active">
        <lucide-icon name="git-compare" [size]="20"></lucide-icon>
        <span>Pitch Comparison</span>
      </a>
      <a class="nav-link" routerLink="/training/interval-training" routerLinkActive="active">
        <lucide-icon name="waves" [size]="20"></lucide-icon>
        <span>Interval Training</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">D</div>
        <div class="user-info">
          <span class="user-name">Davide Beniamin Paun</span>
          <span class="user-email">benipaun5@gmail.com</span>
        </div>
      </div>
      <a href="#" class="logout-link">
        <lucide-icon name="log-out" [size]="20"></lucide-icon>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
