<!-- frontend/src/app/pages/login/login.html -->
<a routerLink="/" class="back-home-btn">
  <lucide-icon name="arrow-left" [size]="18"></lucide-icon>
  <span>Back to Home</span>
</a>
<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <h1>HearMi</h1>
    </div>
    <h2>Welcome Back</h2>
    <p>Sign in to continue your training</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="identifier">Email or Username</label>
        <input
          id="identifier"
          type="text"
          placeholder="you@example.com or yourusername"
          [(ngModel)]="email"
          name="identifier"
          required
        />
      </div>

<div class="form-group">
  <label for="password">Password</label>

  <div class="input-wrapper">
    <input
      id="password"
      [type]="showPassword ? 'text' : 'password'"
      placeholder="••••••••"
      [(ngModel)]="password"
      name="password"
      required
    />

    <button type="button" class="password-toggle" (click)="togglePassword()">
      <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
    </button>
  </div>
</div>

      <button type="submit" class="auth-button">Sign In</button>
    </form>

    <p *ngIf="error" class="error">
      {{ error }}
    </p>

    <p class="switch-auth-link">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </p>
  </div>
</div>
