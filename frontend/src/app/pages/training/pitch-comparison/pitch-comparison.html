<!-- frontend/src/app/pages/training/pitch-comparison/pitch-comparison.html -->

<div class="training-header">
  <h1>Pitch Comparison</h1>
  <p class="subtitle">Listen to two notes and compare their pitch</p>
</div>

<section class="session-stats">
  <div class="stat-card">
    <div class="icon-wrapper" style="background-color: var(--accent-blue-glass); color: var(--accent-blue);">
      <lucide-icon name="target" [size]="20"></lucide-icon>
    </div>
    <p class="stat-text">Score <span class="value">{{score}} / {{questions}}</span></p>
  </div>

  <div class="stat-card">
    <div class="icon-wrapper" style="background-color: var(--accent-pink-glass); color: var(--accent-pink);">
      <lucide-icon name="award" [size]="20"></lucide-icon>
    </div>
    <p class="stat-text">Accuracy <span class="value">{{accuracy}}%</span></p>
  </div>

  <div class="stat-card">
    <div class="icon-wrapper" style="background-color: var(--accent-orange-glass); color: var(--accent-orange);">
      <lucide-icon name="flame" [size]="20"></lucide-icon>
    </div>
    <p class="stat-text">Streak <span class="value">{{streak}}</span></p>
  </div>

  <div class="stat-card">
    <div class="icon-wrapper" style="background-color: var(--accent-green-glass); color: var(--accent-green);">
      <lucide-icon name="list-checks" [size]="20"></lucide-icon>
    </div>
    <p class="stat-text">Progress <span class="value">{{questions}} Questions</span></p>
  </div>
</section>

<div class="main-interaction-card">
  <button
    class="play-button orange"
    (click)="playChallenge()"
    [class.inactive]="isAwaitingAnswer || showFeedback"
  >
    <span class="play-icon">▶</span>
  </button>

  @if (showFeedback) {
    <div class="feedback-popup" [ngClass]="{ 'correct': isCorrect, 'incorrect': !isCorrect }">
      <div class="icon-wrapper">
        <lucide-icon [name]="isCorrect ? 'check-circle-2' : 'x-circle'" [size]="24"></lucide-icon>
      </div>
      <div class="message">
        <h4>{{ isCorrect ? 'Correct' : 'Incorrect' }}</h4>
        <p>{{ feedbackMessage }}</p>
      </div>
    </div>
  }

  <div class="answer-grid" style="grid-template-columns: repeat(3, 1fr);">
    <button
      class="answer-button"
      (click)="checkAnswer('Higher')"
      [disabled]="!isAwaitingAnswer"
    >
      <lucide-icon name="arrow-up" [size]="24"></lucide-icon>
      Higher
    </button>
    <button
      class="answer-button"
      (click)="checkAnswer('Same')"
      [disabled]="!isAwaitingAnswer"
    >
      <lucide-icon name="minus" [size]="24"></lucide-icon>
      Same
    </button>
    <button
      class="answer-button"
      (click)="checkAnswer('Lower')"
      [disabled]="!isAwaitingAnswer"
    >
      <lucide-icon name="arrow-down" [size]="24"></lucide-icon>
      Lower
    </button>
  </div>
</div>

<div class="session-controls">
  <button class="btn btn-reset" (click)="resetSession()">Reset</button>

  <button
    class="btn btn-save orange"
    (click)="saveSession()"
    [disabled]="isSaving || questions === 0"
  >
    {{ isSaving ? 'Saving…' : 'Save & New Session' }}
  </button>
</div>

<div class="session-messages">
  <p *ngIf="saveSuccess" class="session-success">
    {{ saveSuccess }}
  </p>
  <p *ngIf="saveError" class="session-error">
    {{ saveError }}
  </p>
</div>
