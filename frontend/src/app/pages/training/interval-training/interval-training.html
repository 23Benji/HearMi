<div class="training-header">
  <h1>Interval Training</h1>
  <p class="subtitle">Identify the interval between two notes</p>
</div>

<section class="session-stats">
  <div class="stat-card">Score: <span>{{score}} / {{questions}}</span></div>
  <div class="stat-card">Accuracy: <span>{{accuracy}}%</span></div>
  <div class="stat-card">Streak: <span>{{streak}}</span></div>
  <div class="stat-card">Questions: <span>{{questions}}</span></div>
</section>

<section class="player-section">
  <button class="play-button" (click)="playChallenge()">
    <span class="play-icon">▶</span>
  </button>
  <p>Click to play the interval</p>
</section>

<section class="answer-grid">
    <button class="answer-button" *ngFor="let interval of intervals" (click)="checkAnswer(interval)">{{interval}}</button>
</section>

<section class="session-controls">
  <button class="btn" (click)="resetSession()">Reset Session</button>
  <button class="btn btn-green" (click)="saveSession()">Save & New Session</button>
</section>
