<div class="training-header">
  <h1>Single Note Training</h1>
  <p class="subtitle">Identify individual notes by ear</p>
</div>

<section class="session-stats">
  <div class="stat-card">Score: <span>{{score}} / {{questions}}</span></div>
  <div class="stat-card">Accuracy: <span>{{accuracy}}%</span></div>
  <div class="stat-card">Streak: <span>{{streak}}</span></div>
  <div class="stat-card">Questions: <span>{{questions}}</span></div>
</section>

<section class="player-section">
  <button class="play-button" (click)="playChallenge()">
    <span class="play-icon">▶</span>
  </button>
  <p>Click to play the note</p>
</section>

<section class="answer-grid" style="grid-template-columns: repeat(6, 1fr);">
  <button class="answer-button" *ngFor="let note of notes" (click)="checkAnswer(note)">{{note}}</button>
</section>

<section class="session-controls">
  <button class="btn" (click)="resetSession()">Reset Session</button>
  <button class="btn btn-cyan" (click)="saveSession()">Save & New Session</button>
</section>
