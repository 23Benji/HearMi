<div class="training-header">
  <h1>Single Note Training</h1>
  <p class="subtitle">Identify individual notes by ear</p>
</div>

<section class="session-stats">
  <div class="stat-card">Score: <span>{{score}} / {{questions}}</span></div>
  <div class="stat-card">Accuracy: <span>{{accuracy}}%</span></div>
  <div class="stat-card">Streak: <span>{{streak}}</span></div>
  <div class="stat-card">Questions: <span>{{questions}}</span></div>
</section>

<section class="player-section">
  <button class="play-button"><span class="play-icon">▶</span></button>
  <p>Click to play the note</p>
</section>

<section class="answer-grid">
  <button class="answer-button" *ngFor="let note of notes">{{note}}</button>
</section>

<section class="session-controls">
  <button class="btn">Reset Session</button>
  <button class="btn" style="background: var(--accent-gradient);">Save & New Session</button>
</section>
