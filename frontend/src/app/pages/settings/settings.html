<div class="settings-header">
  <h1>Account Settings</h1>
  <p class="subtitle">Manage your profile and account details.</p>
</div>

<div class="settings-card">

  <h2><lucide-icon name="user-circle" [size]="20"></lucide-icon> Profile</h2>

  <div class="profile-picture-section">
    <img *ngIf="profileImageUrl" [src]="profileImageUrl" alt="User Avatar" class="avatar">

    <div *ngIf="!profileImageUrl" class="avatar placeholder">
      {{ usernameInitial }}
    </div>

    <div class="upload-actions">
      <label for="profilePictureInput" class="upload-label">
        <lucide-icon name="upload" [size]="16"></lucide-icon>
        <span>Change Picture</span>
      </label>
      <input type="file" id="profilePictureInput" (change)="onFileSelected($event)" accept="image/*" hidden>

      <button
        *ngIf="profileImageUrl"
        class="upload-label"
        style="background-color: transparent; border-color: var(--accent-orange); color: var(--accent-orange); margin-top: 0.25rem;"
        (click)="removeAvatar()"
      >
        <lucide-icon name="trash-2" [size]="16"></lucide-icon>
        <span>Remove</span>
      </button>

      <span class="upload-hint">PNG, JPG, or GIF. Max 2MB.</span>
    </div>
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" [(ngModel)]="username" disabled>
  </div>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" [value]="email" disabled>
  </div>

  <h2><lucide-icon name="alert-triangle" [size]="20"></lucide-icon> Danger Zone</h2>
  <div class="danger-zone">
    <div class="danger-item">
      <div class="info"><h4>Reset All Progress</h4><p>Erase all training history.</p></div>
      <button class="btn btn-danger" (click)="resetProgress()"><lucide-icon name="rotate-cw" [size]="16"></lucide-icon> Reset</button>
    </div>
    <div class="danger-item">
      <div class="info"><h4>Delete Account</h4><p>Permanently delete your account.</p></div>
      <button class="btn btn-danger" (click)="deleteAccount()"><lucide-icon name="trash-2" [size]="16"></lucide-icon> Delete</button>
    </div>
  </div>

  <div class="settings-actions">
    <button class="btn btn-save cyan" (click)="saveChanges()">Save Changes</button>
  </div>
</div>
